<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
  
<title>Station météo Francazal</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(
    180deg,
    #4facfe 0%,
    #00f2fe 100%
  );
}


/* Conteneur principal */

.station {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 1.35fr 1.3fr 1.35fr;
  align-items: center;
  padding: 20px;
  gap: 10px;
}


/* Fenêtres radar */

.radar {
  height: 75%;
  border-radius: 25px;
  background:
    linear-gradient(
      135deg,
      rgba(0,120,255,0.35),
      rgba(0,0,80,0.45)
    );
  backdrop-filter: blur(10px);
  overflow: hidden;
  position: relative;
}


/* Cadre radar pluie */

#radar-frame,
#radar-frame-vent {

  position: relative;
  width: 100%;
  height: 100%;
  overflow: auto;

}



/* Fenêtre MétéoCiel pluie */

#meteocielRadar {

  position: absolute;

  top: -120px;
  left: -250px;

  width: 1600px;
  height: 1200px;

  border: none;

}



/* Fenêtre MétéoCiel vent */

#meteocielVent {

  position: absolute;

  top: -120px;
  left: -250px;

  width: 1600px;
  height: 1200px;

  border: none;

}



/* Décoration légère */

.radar::before {

  content: "";

  position: absolute;

  width: 160%;
  height: 160%;

  background:
    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,0.08),
      rgba(255,255,255,0.08) 2px,
      transparent 2px,
      transparent 12px
    );

  animation: mouvementRadar 8s linear infinite;

  pointer-events: none;

}


@keyframes mouvementRadar {

from {
  transform: rotate(0deg);
}

to {
  transform: rotate(360deg);
}

}


/* Partie centrale */

.centre {

  text-align: center;

}


h1 {

  font-size: 42px;

  margin: 0 0 20px 0;

  text-shadow:
  0 3px 10px rgba(0,0,0,0.3);

}


.temperature {

  font-size: 120px;

  font-weight: bold;

  line-height: 1;

  text-shadow:
  0 5px 15px rgba(0,0,0,0.3);

}


/* Données météo sans cartes */

.informations{
  margin-top:40px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.carte{
  background:none;
  backdrop-filter:none;
  border:none;
  padding:25px;
  font-size:28px;
  text-align:center;
}

.label{
  font-size:18px;
  opacity:0.8;
  margin-bottom:10px;
}

/* Mise à jour */

.maj {

  margin-top: 30px;

  font-size: 18px;

  opacity: 0.8;

}
/* Rose des vents */

.boussole {
  position: relative;
  width: 90px;
  height: 90px;
  margin: auto;
  border: 3px solid rgba(255,255,255,0.8);
  border-radius: 50%;
}



.boussole .nord,
.boussole .est,
.boussole .sud,
.boussole .ouest {
  position: absolute;
  font-size: 14px;
  font-weight: bold;
}

.nord {
  top: 4px;
  left: 50%;
  transform: translateX(-50%);
}

.est {
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
}

.sud {
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
}

.ouest {
  left: 6px;
  top: 50%;
  transform: translateY(-50%);
}

.fleche-vent {
  position: absolute;
  width: 3px;
  height: 30px;
  background: #ffffff;
  left: 50%;
  top: 50%;
  transform-origin: 50% calc(100% - 3px);
  transform: translate(-50%, -100%) rotate(0deg);
}

.fleche-vent::before {
  content: "";
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 10px solid white;
}
  
  </style>

</head>


<body>


<div class="station">


<!-- Radar pluie MétéoCiel -->

<div class="radar">

    <div id="radar-frame">

        <iframe
            id="meteocielRadar"
            src="https://www.meteociel.fr/observations-meteo/radarzoom.php?x=4619.51&y=8107.37&ech=4&zoom=2">
        </iframe>

    </div>

</div>



<!-- Partie centrale -->

<div class="centre">

<h1>
Station météo Francazal
</h1>


<div class="temperature" id="temperature">
-- °C
</div>



<div class="informations">


<div class="carte">

<div class="label">
Pression
</div>

<div id="pression">
-- hPa
</div>

</div>



<div class="carte">

<div class="label">
Humidité
</div>

<div id="humidite">
-- %
</div>

</div>



<div class="carte">

<div class="label">
Vent
</div>

<div id="vent">
-- km/h
</div>

</div>



<div class="carte">

<div class="label">
Direction du vent
</div>

<div class="rose-des-vents">

  <div class="boussole">
    <div class="lettre nord">N</div>
    <div class="lettre est">E</div>
    <div class="lettre sud">S</div>
    <div class="lettre ouest">O</div>

    <div id="flecheVent" class="fleche-vent"></div>

  </div>

</div>

</div>


</div>



<div class="maj" id="maj">
Dernière mise à jour : --
</div>


</div>





<!-- Radar vent MétéoCiel -->

<div class="radar">

    <div id="radar-frame-vent">

        <iframe
            id="meteocielVent"
            src="https://www.meteociel.fr/observations-meteo/vent-rafales.php?region=so&mode=0">
        </iframe>

    </div>

</div>





</div>



<!-- Zone d'alerte météo future -->

<div id="alerte" class="alerte">
</div>



<style>


.alerte {

  position: fixed;

  top: 20px;

  left: 50%;

  transform: translateX(-50%);

  width: 80%;

  padding: 20px;

  border-radius: 20px;

  text-align: center;

  font-size: 32px;

  font-weight: bold;

  background:
  rgba(255,0,0,0.85);

  display: none;

  z-index: 10;

  animation: clignote 1s infinite;

}



@keyframes clignote {

0% {

opacity: 1;

}

50% {

opacity: 0.4;

}

100% {

opacity: 1;

}

}



/* Fonds météo */

.meteo-soleil {

background:
linear-gradient(
180deg,
#56ccf2,
#2f80ed
);

}



.meteo-nuage {

background:
linear-gradient(
180deg,
#757f9a,
#d7dde8
);

}



.meteo-pluie {

background:
linear-gradient(
180deg,
#485563,
#29323c
);

}



.meteo-orage {

background:
linear-gradient(
180deg,
#141e30,
#243b55
);

}



</style>


<script>


const url = "https://script.google.com/macros/s/AKfycbz6al08GPfgg99-xR18yNuG3wQ6kmABbMEJ7lhrld1g1JJUilkkYxrB3ry30UfQhn31Nw/exec";



function changerFondMeteo(humidite) {


let corps = document.body;


corps.classList.remove(
"meteo-soleil",
"meteo-nuage",
"meteo-pluie",
"meteo-orage"
);



if (humidite > 85) {

corps.classList.add("meteo-pluie");

}

else if (humidite > 70) {

corps.classList.add("meteo-nuage");

}

else {

corps.classList.add("meteo-soleil");

}


}



function chargerMeteo() {


fetch(url)

.then(response => response.json())

.then(data => {



document.getElementById("temperature").innerHTML =
data.temperature + " °C";



document.getElementById("pression").innerHTML =
Number(data.pression).toFixed(1) + " hPa";



document.getElementById("humidite").innerHTML =
data.humidite + " %";



document.getElementById("vent").innerHTML =
Math.round(data.vent) + " km/h";


let degres = Math.round(data.direction);
  const fleche = document.getElementById("flecheVent");

if (fleche) {
  fleche.style.transform =
    "translate(-50%, -100%) rotate(" + degres + "deg)";
}


let directionTexte = "";


if (degres >= 337.5 || degres < 22.5) {

directionTexte = "Nord";

}

else if (degres < 67.5) {

directionTexte = "Nord-Est";

}

else if (degres < 112.5) {

directionTexte = "Est";

}

else if (degres < 157.5) {

directionTexte = "Sud-Est";

}

else if (degres < 202.5) {

directionTexte = "Sud";

}

else if (degres < 247.5) {

directionTexte = "Sud-Ouest";

}

else if (degres < 292.5) {

directionTexte = "Ouest";

}

else {

directionTexte = "Nord-Ouest";

}



// La direction est maintenant affichée uniquement avec la rose des vents



let heureLocale = new Date(data.miseAJour).toLocaleString("fr-FR", {
  timeZone: "Europe/Paris",
  hour: "2-digit",
  minute: "2-digit",
  day: "2-digit",
  month: "2-digit",
  year: "numeric"
});


document.getElementById("maj").innerHTML =
"Dernière mise à jour : " + heureLocale;



changerFondMeteo(data.humidite);



})


.catch(error => {

console.log("Erreur météo :", error);

});


}





chargerMeteo();



setInterval(chargerMeteo, 900000);



// Rafraîchissement automatique du radar vent MétéoCiel
// toutes les heures (la page vent ne possède pas de lecture automatique)

setInterval(() => {

const vent = document.getElementById("meteocielVent");

if (vent) {

vent.src = vent.src;

}

}, 3600000);


if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker.register("service-worker.js");

  });

}
  
</script>


</body>

</html>
